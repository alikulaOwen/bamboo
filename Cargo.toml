[workspace]
resolver = "2"
members = [
    "crates/bamboo-core",
    "crates/bamboo-evm",
    "crates/bamboo-solana",
    "crates/bamboo-hedging",
    "crates/bamboo-fiat",
    "crates/bamboo-relayer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Bamboo Protocol Architects"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bamboo-core = { path = "crates/bamboo-core" }
bamboo-evm = { path = "crates/bamboo-evm" }
bamboo-solana = { path = "crates/bamboo-solana" }
bamboo-hedging = { path = "crates/bamboo-hedging" }
bamboo-fiat = { path = "crates/bamboo-fiat" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
alloy = { version = "2.4", features = ["full", "sol-types"] }
alloy-primitives = { version = "1.7", features = ["serde"] }
alloy-sol-types = "1.7"
axum = { version = "0.7", features = ["ws"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"
